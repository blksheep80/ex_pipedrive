# Manual publish for optional Mix projects under packages/.
# Do not attach this to core GitHub Releases — re-releasing core would try to
# republish sibling 0.1.0 and fail.
name: Hex publish packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - ex_pipedrive_web
          - ex_pipedrive_oban
          - ex_pipedrive_phoenix
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    env:
      HEX_PUBLISH: "1"
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.2"
          otp-version: "27.0"

      - name: Install dependencies
        run: mix deps.get

      - name: Publish to Hex
        run: mix hex.publish --yes
