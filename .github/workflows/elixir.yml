name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: "OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.2"
            otp: "27.0"
          - elixir: "1.18.3"
            otp: "27.3"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run credo
        run: mix credo --strict

      - name: Run doctor
        if: matrix.elixir == '1.17.2'
        run: mix doctor

      - name: Run tests
        run: mix test

      - name: Restore PLT cache
        if: matrix.elixir == '1.17.2'
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Run dialyzer
        if: matrix.elixir == '1.17.2'
        run: mix dialyzer --format github

      - name: Build docs
        if: matrix.elixir == '1.17.2'
        run: mix docs

  web:
    name: "ex_pipedrive_web OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ex_pipedrive_web
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.2"
            otp: "27.0"
          - elixir: "1.18.3"
            otp: "27.3"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            packages/ex_pipedrive_web/deps
            packages/ex_pipedrive_web/_build
          key: ${{ runner.os }}-web-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('packages/ex_pipedrive_web/mix.lock', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-web-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run credo
        if: matrix.elixir == '1.17.2'
        run: mix credo --strict

      - name: Run tests
        run: mix test

  oban:
    name: "ex_pipedrive_oban OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ex_pipedrive_oban
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.2"
            otp: "27.0"
          - elixir: "1.18.3"
            otp: "27.3"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            packages/ex_pipedrive_oban/deps
            packages/ex_pipedrive_oban/_build
          key: ${{ runner.os }}-oban-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('packages/ex_pipedrive_oban/mix.lock', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-oban-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run credo
        if: matrix.elixir == '1.17.2'
        run: mix credo --strict

      - name: Run tests
        run: mix test
