# Publish optional Hex packages from their own GitHub remotes.
# HEX_API_KEY lives on this repo; add-on repos do not have it yet.
name: Hex publish add-ons

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - ex_pipedrive_web
          - ex_pipedrive_oban
          - ex_pipedrive_phoenix
    env:
      HEX_PUBLISH: "1"
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - name: Check out add-on package
        uses: actions/checkout@v4
        with:
          repository: blksheep80/${{ matrix.package }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.2"
          otp-version: "27.0"

      - name: Install dependencies
        run: mix deps.get

      - name: Publish to Hex
        run: mix hex.publish --yes
